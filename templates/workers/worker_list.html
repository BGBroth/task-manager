{% extends "base.html" %}

{% block content %}
	<h1>
		Worker list
		<a href="{% url 'workers:worker-create' %}" class="btn btn-primary link-to-page">
			Create
		</a>
	</h1>
	<form class="navbar-search form-inline" id="navbar-search-main" method="get" action="">
		<div class="input-group input-group-merge search-bar">
			<input type="submit" value="🔍" class="btn btn-sm btn-outline-gray-600">
			{{ search_form }}
		</div>
	</form>




	{% if worker_list %}
		<ul>
			{% for worker in worker_list %}
				<li>
					<a href="{% url "workers:worker-detail" pk=worker.id %}">{{ worker.id }}</a>
					{{ worker.username }}
				</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>There are no workers in task_manager</p>
	{% endif %}
{% endblock %}
