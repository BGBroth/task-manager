{% extends "base.html" %}

{% block content %}
  <h1>
    {{ tag.name }}
    <a href="{% url 'task_manager:tag-delete' pk=tag.id %}" class="btn btn-danger link-to-page">
      Delete
    </a>
    <a href="{% url 'task_manager:tag-update' pk=tag.id %}" class="btn btn-secondary link-to-page">
      Update
    </a>
  </h1>
	<hr>
	<p>Tag type: {{ tag.tag_type.name }}</p>
	<hr>
  <ul>
    {% for worker in tag.workers.all %}
      <li>{{ worker.username }} ({{ worker.first_name }} {{ worker.last_name }})</li>
    {% endfor %}
  </ul>
{% endblock %}
