{% extends "base.html" %}

{% block content %}
	<h1>
		Project list
		<a href="{% url 'task_manager:project-create' %}" class="btn btn-primary link-to-page">
			Create
		</a>
	</h1>
	<form method="get" action="">
		{{ search_form }}
		<input type="submit" value="Search" class="btn btn-primary">
	</form>
	{% if project_list %}
		<ul>
			{% for project in project_list %}
				<li>
					<a href="{% url "task_manager:project-detail" pk=project.id %} ">{{ project.id }}</a>
					{{ project.name }}
				</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>There are no projects in task_manager</p>
	{% endif %}
{% endblock %}
