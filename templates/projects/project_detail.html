{% extends "base.html" %}

{% block content %}
	<h1>
		{{ project.name }}
		<a href="{% url 'projects:project-delete' pk=project.id %}" class="btn btn-danger link-to-page">
			Delete
		</a>
		<a href="{% url 'projects:project-update' pk=project.id %}" class="btn btn-secondary link-to-page">
			Update
		</a>
	</h1>

	<p>{{ project.description }}</p>

	<hr>

	<ul>
		{% for team in project.teams.all %}
			<li>
				<a href="{% url 'projects:team-detail' pk=team.id %}">
					{{ team.name }}
				</a>
			</li>
		{% endfor %}
	</ul>

	<hr>

	<ul>
		{% for task in project.tasks.all %}
			<li>
				<a href="{% url 'tasks:task-detail' pk=task.id %}">
					{{ task.name }}
				</a>
			</li>
		{% endfor %}
	</ul>
{% endblock %}
