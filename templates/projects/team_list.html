{% extends "base.html" %}

{% block content %}
	<h1>
		Team list
		<a href="{% url 'projects:team-create' %}" class="btn btn-primary link-to-page">
			Create
		</a>
	</h1>
	<form class="navbar-search form-inline" id="navbar-search-main" method="get" action="">
		<div class="input-group input-group-merge search-bar">
			<input type="submit" value="🔍" class="btn btn-sm btn-outline-gray-600">
			{{ search_form }}
		</div>
	</form>
	{% if team_list %}
		<ul>
			{% for team in team_list %}
				<li>
					<a href="{% url "projects:team-detail" pk=team.id %} ">{{ team.id }}</a>
					{{ team.name }}
				</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>There are no teams in task_manager</p>
	{% endif %}
{% endblock %}
