{% extends "base.html" %}

{% block content %}
	<h1>
		Project list
		<a href="{% url 'projects:project-create' %}" class="btn btn-primary link-to-page">
			Create
		</a>
	</h1>

	<form class="navbar-search form-inline" id="navbar-search-main" method="get" action="">
		<div class="input-group input-group-merge search-bar">
			<input type="submit" value="🔍" class="btn btn-sm btn-outline-gray-600">
			{{ search_form }}
		</div>
	</form>

	<br>

	{% if project_list %}
		<div class="card border-0 shadow mb-4">
			<div class="card-body">
				<div class="table-responsive">
					<table class="table table-centered table-nowrap mb-0 rounded">
						<thead class="thead-light">
						<tr>
							<th class="border-0 rounded-start">#</th>
							<th class="border-0">Name</th>
						</tr>
						</thead>
						<tbody>
						<!-- Item -->
						{% for project in project_list %}
							<tr>
								<td>
									<a href="{% url "projects:project-detail" pk=project.id %}">{{ project.id }}</a>
								</td>
								<td>
									<a href="{% url "projects:project-detail" pk=project.id %}">{{ project.name }}</a>
								</td>
							</tr>
						{% endfor %}
						<!-- End of Item -->
						</tbody>
					</table>
				</div>
			</div>
		</div>
	{% else %}
		<p>There are no projects in task_manager</p>
	{% endif %}
{% endblock %}
