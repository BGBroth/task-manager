{% extends "base.html" %}

{% block content %}
	<h1>
		Tag list
		<a href="{% url 'tasks:tag-create' %}" class="btn btn-primary link-to-page">
			Create
		</a>
	</h1>
	<form class="navbar-search form-inline" id="navbar-search-main" method="get" action="">
		<div class="input-group input-group-merge search-bar">
			<input type="submit" value="🔍" class="btn btn-sm btn-outline-gray-600">
			{{ search_form }}
		</div>
	</form>
	{% if tag_list %}
		<ul>
			{% for tag in tag_list %}
				<li>
					<a href="{% url "tasks:tag-detail" pk=tag.id %} ">{{ tag.id }}</a>
					{{ tag.name }}
				</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>There are no tags in task_manager</p>
	{% endif %}
{% endblock %}
