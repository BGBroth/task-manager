{% extends "base.html" %}

{% block content %}
	<h1>
		Task Type List
		<a href="{% url 'tasks:task-type-create' %}" class="btn btn-primary link-to-page">
			Create
		</a>
	</h1>
	<form class="navbar-search form-inline" id="navbar-search-main" method="get" action="">
		<div class="input-group input-group-merge search-bar">
			<input type="submit" value="🔍" class="btn btn-sm btn-outline-gray-600">
			{{ search_form }}
		</div>
	</form>
	{% if task_type_list %}
		<ul>
			{% for task_type in task_type_list %}
				<li>
					<a href="{% url "tasks:task-type-detail" pk=task_type.id %} ">{{ task_type.id }}</a>
					{{ task_type.name }}
				</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>There are no task types in task_manager</p>
	{% endif %}
{% endblock %}
