{% extends "base.html" %}

{% block content %}
  <h1>
    {{ tag.name }}
    <a href="{% url 'tasks:tag-delete' pk=tag.id %}" class="btn btn-danger link-to-page">
      Delete
    </a>
    <a href="{% url 'tasks:tag-update' pk=tag.id %}" class="btn btn-secondary link-to-page">
      Update
    </a>
  </h1>

	<hr>

  <ul>
		{% for task in tag.tasks.all %}
			<li>
				<a href="{% url 'tasks:task-detail' pk=task.id %}">
					{{ task.name }}
				</a>
			</li>
		{% endfor %}
	</ul>
{% endblock %}
